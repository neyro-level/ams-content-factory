services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ams-content-factory-postgres
    environment:
      POSTGRES_DB: ams_content_factory
      POSTGRES_USER: ams_content_factory
      POSTGRES_PASSWORD: ams_content_factory_dev_only
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ams_content_factory -d ams_content_factory']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ams-content-factory-postgres:/var/lib/postgresql/data

volumes:
  ams-content-factory-postgres:
