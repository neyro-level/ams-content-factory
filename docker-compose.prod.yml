name: ams-content-factory

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ['pnpm', 'prisma:deploy']
    networks: [internal]
    profiles: [maintenance]

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ['pnpm', 'db:seed']
    networks: [internal]
    profiles: [maintenance]

  backup:
    image: postgres:16-bookworm
    env_file: .env
    entrypoint: ['sh', '-c']
    command: ['exec pg_dump --format=custom --no-owner "$$DATABASE_URL"']
    networks: [internal]
    profiles: [maintenance]

  restore:
    image: postgres:16-bookworm
    env_file: .env
    entrypoint: ['sh', '-c']
    command:
      [
        'exec pg_restore --clean --if-exists --no-owner --dbname "$$DATABASE_URL" /restore/input.dump',
      ]
    volumes:
      - '${RESTORE_FILE:-./backups/restore-not-configured.dump}:/restore/input.dump:ro'
    networks: [internal]
    profiles: [maintenance]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ['node', 'apps/web/.next/standalone/apps/web/server.js']
    expose: ['3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ['pnpm', '--filter', '@ams-content-factory/worker', 'start']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3205/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/api/health/ready']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

networks:
  internal:
    driver: bridge
