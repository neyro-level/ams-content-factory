name: ams-content-factory

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ['pnpm', 'prisma:deploy']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    profiles: [maintenance]

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    command: ['pnpm', 'db:seed']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    profiles: [maintenance]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ['pnpm', '--filter', '@ams-content-factory/web', 'start']
    depends_on:
      postgres:
        condition: service_healthy
    expose: ['3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ['pnpm', '--filter', '@ams-content-factory/worker', 'start']
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'kill -0 1']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/api/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
